name: CI - Tests & Build

on:
  push:
  

jobs:
  flutter_test:
    name: Run Flutter Tests & Analyze Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "./ewc_frontend"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup and Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Secrets
        run: |
          touch .env
          echo API_KEY=${API_KEY} >> .env
        env:
          api_key: ${{ secrets.API_KEY }}

      - name: Install lcov
        run: |
          sudo apt-get update && sudo apt-get install -y lcov

      - name: Static Analysis & Unit Tests (Flutter)
        working-directory: "./ewc_frontend"
        run: |
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
          flutter analyze
          flutter test --coverage
          
      - name: Generate Code Report and Documentation
        working-directory: "./ewc_frontend"
        run: |
          genhtml coverage/lcov.info -o coverage/html
          dart doc 
    
      - name: Upload Coverage HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage-html
          path: /home/runner/work/2024-AIEnhancedWasteCollection/2024-AIEnhancedWasteCollection/ewc_frontend/coverage/html

      - name: Upload Documentation HTML
        uses: actions/upload-artifact@v4
        with:
          name: documentation-html
          path: /home/runner/work/2024-AIEnhancedWasteCollection/2024-AIEnhancedWasteCollection/ewc_frontend/doc/api/ 
      
      
  django_test:
    name: Run Django Tests & Analyze Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set environment variables
        run: |
          echo "DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}" >> ewc_backend/.env
          echo "POSTGRES_DB=${POSTGRES_DB}" >> ewc_backend/.env
          echo "POSTGRES_USER=${POSTGRES_USER}" >> ewc_backend/.env
          echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" >> ewc_backend/.env
          echo "POSTGRES_HOST=${POSTGRES_HOST}" >> ewc_backend/.env
          echo "POSTGRES_PORT=${POSTGRES_PORT}" >> ewc_backend/.env
          echo "SENDGRID_SECRET_KEY=${SENDGRID_SECRET_KEY}" >> ewc_backend/.env
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          SENDGRID_SECRET_KEY: ${{ secrets.SENDGRID_SECRET_KEY }}

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r ewc_backend/requirements.txt

      - name: Run migrations
        run: |
          cd ewc_backend
          python manage.py migrate

      - name: Run Django tests with coverage
        run: |
          cd ewc_backend
          coverage run manage.py test ewc_core.tests --noinput
          coverage report -m
          coverage html

      - name: Upload Coverage HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: django-coverage-html
          path: ewc_backend/htmlcov


  build:
    name: Build app
    needs: [flutter_test]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: "./ewc_frontend"
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout Respository
        uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: "17.x"

      - name: Configure Flutter environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Secrets
        run: |
          touch .env
          echo API_KEY=${API_KEY} >> .env
        env:
          api_key: ${{ secrets.API_KEY }}

      - name: Build Android app
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          echo "Building Android..."
          pwd
          flutter pub get
          flutter build apk --no-pub
          flutter build appbundle --no-pub 

      - name: Build iOS app
        if: ${{ matrix.os == 'macos-latest' }}
        run: |
          echo "Building iOS..."
          flutter pub get
          flutter clean
          flutter build ios --no-codesign
