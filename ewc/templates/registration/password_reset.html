<!--HTML code for confirm password reset page-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <!-- Link for Questrial font -->
    <link href="https://fonts.googleapis.com/css2?family=Questrial&display=swap" rel="stylesheet">
    <!-- CSS code for design starts here -->
    <style>
        /* General styles for the page */
        body {
            font-family: 'Questrial', sans-serif;
            background: linear-gradient(135deg, #e0f7fa, #c8e6c9);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #2E7D32;
        }

        .container {
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            padding: 20px;
            text-align: center;
        }

        h3 {
            font-size: 1.5em;
            color: #1B5E20;
            margin-bottom: 10px;
        }

        p {
            font-size: 1rem;
            color: #4CAF50;
            margin-bottom: 20px;
        }

        form input[type="email"],
        form input[type="submit"] {
            width: calc(100% - 20px);
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #A5D6A7;
            border-radius: 5px;
            font-size: 1rem;
            font-family: 'Questrial', sans-serif; /* Questrial font applied */
        }

        form input[type="submit"] {
            background: #2E7D32;
            color: #fff;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 20px; /* Extra space below the input field */
        }

        form input[type="submit"]:hover {
            background: #1B5E20;
        }
    </style>
</head>
<body>
    <div class="container">
        <h3>Password Reset</h3>
        <p>
            Forgotten your password? Enter your email address below, and we'll email you 
            instructions for setting a new one.
        </p>
        <form method="post"> 
            {% csrf_token %}
            <input type="email" name="email" placeholder="Enter your email" required>
            <input type="submit" value="Reset Password">
        </form>
    </div>
</body>
</html>
