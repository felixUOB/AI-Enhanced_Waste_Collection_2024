<!--HTML code for confirm password reset page-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <!--- link for Questrial font --> 
    <link href="https://fonts.googleapis.com/css2?family=Questrial&display=swap" rel="stylesheet">
    <!-- CSS code for design starts here-->
    <style>
        /* General styles for the page */
        body {
            font-family: 'Questrial', sans-serif;
            background: linear-gradient(135deg, #e0f7fa, #c8e6c9); /* Recycling theme gradient */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #2E7D32; /* Green tone for text */
        }

        /* Centered container */
        .container {
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            padding: 20px;
            text-align: center;
        }

        /* Heading styles */
        h3 {
            font-size: 1.5em;
            color: #1B5E20; /* Dark green */
            margin-bottom: 10px;
        }

        /* Form paragraph */
        p {
            font-size: 1rem;
            color: #4CAF50; /* Lighter green tone */
            margin-bottom: 20px;
        }

        /* Form fields */
        form input[type="password"] {
            width: calc(100% - 20px);
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #A5D6A7; /* Light green border */
            border-radius: 5px;
            font-size: 1rem;
        }

        /* Submit button */
        form button {
            background: #2E7D32; /* Recycling theme green */
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s;
        }

        form button:hover {
            background: #1B5E20; /* Darker green on hover */
        }
    </style>
</head>
<body>
    <div class="container">
        <h3>Enter New Password</h3>
        <p>Enter your new password twice so we can verify that you typed it in correctly.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Reset Password</button>
        </form>
    </div>
</body>
</html>
